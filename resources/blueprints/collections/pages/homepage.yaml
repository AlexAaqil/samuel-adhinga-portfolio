title: HomePage
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: hero_image
            field:
              container: images
              max_files: 1
              min_files: 1
              type: assets
              display: HeroImage
          -
            handle: catch_phrase
            field:
              type: textarea
              display: 'Catch Phrase'
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
