title: Footer
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: quick_links
            field:
              type: grid
              display: 'Quick Links'
              fields:
                -
                  handle: quick_link_text
                  field:
                    type: text
                    display: 'Quick Link Text'
                -
                  handle: quick_link_url
                  field:
                    type: link
                    display: 'Quick Link URL'
          -
            handle: service_links
            field:
              type: grid
              display: 'Service Links'
              fields:
                -
                  handle: service_link_text
                  field:
                    type: text
                    display: 'Service Link Text'
                -
                  handle: service_link_url
                  field:
                    type: link
                    display: 'Service Link URL'
          -
            handle: social_links
            field:
              type: grid
              display: 'Social Links'
              fields:
                -
                  handle: social_logo
                  field:
                    container: images
                    max_files: 1
                    min_files: 1
                    type: assets
                    display: 'Social Logo'
                -
                  handle: social_url
                  field:
                    type: link
                    display: 'Social URL'
          -
            handle: copyright_text
            field:
              type: text
              display: 'Copyright Text'
