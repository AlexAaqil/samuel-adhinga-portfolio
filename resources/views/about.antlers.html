<div class="AboutPage">
    <section class="Hero mb-15">
        <div class="container-fluid">
            <div class="hero-content-wrapper py-4 lg:py-16 grid gap-8 lg:grid-cols-12">
                <div class="image lg:col-span-5 lg:justify-self-center">
                    <img src={{ image }} alt={{ image:alt ?? about_page_title }}>
                </div>

                <div class="content lg:col-span-7">
                    <h1 class="font-bold text-heading-text mb-4">{{ about_page_title }}</h1>

                    <div class="[&>p]:mb-4">
                        {{ about_content | markdown }}
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
