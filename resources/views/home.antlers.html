{{# Everything here is disposable — delete with the home entry. #}}
<style>
    @keyframes fade-up {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="HomePage">
    <section class="Hero">
        <div class="hero_image h-[50dvh] lg:h-[90dvh]">
            <img src="{{ hero_image:url }}" alt="" class="w-full h-full object-cover">
        </div>
    </section>

    <section class="CatchPhrase h-[40dvh] lg:h-dvh flex items-center justify-center py-8">
        <div class="container-fluid">
            <p class="font-bold lg:text-l-text uppercase text-center">{{ catch_phrase | nl2br }}</p>
        </div>
    </section>

    <section class="RecentProjects py-8">
        <div class="container-fluid">
            <div class="projects-wrapper grid lg:grid-cols-2 gap-8">
                {{ recent_projects }}
                    <div class="project">
                        <div class="image h-[40dvh] lg:h-[60dvh]">
                            <img src="{{ project_image:url }}" alt="{{ project_image:alt ?? 'Project Image' }}" class="w-full h-full object-cover">
                        </div>

                        <div class="content py-4 px-2 space-y-2">
                            <p class="font-bold">{{ project_name }}</p>
                            <p class="text-caption-text">{{ project_year }}</p>
                        </div>
                    </div>
                {{ /recent_projects }}
            </div>
        </div>
    </section>
</div>
